<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>양희본 0집 · 관리자</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#A98BFF;--bg:#0D1230;--bg2:#131A3D;--line:#2C3566;--text:#F3F2F8;--muted:#A3A8C6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:32px 20px 120px}
h1{font-size:24px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 16px;color:var(--accent);letter-spacing:.04em}
p.note{color:var(--muted);font-size:14px;margin:0 0 24px}
fieldset{border:1px solid var(--line);border-radius:8px;padding:20px;margin:0 0 20px;background:var(--bg2)}
legend{padding:0 8px;color:var(--accent);font-weight:700}
label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
label:first-of-type{margin-top:0}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:#0A0E26;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type=color]{height:44px;padding:4px;width:80px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1 1 200px}
button{font:inherit;font-size:16px;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);font-weight:700;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(13,18,48,.96);border-top:1px solid var(--line);padding:12px 20px}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#status{font-size:14px;color:var(--muted);flex:1 1 200px}
.cover-prev{margin-top:10px;max-width:180px;border-radius:4px;display:block}
a{color:var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>양희본 0집 · 관리자</h1>
  <p class="note">여기서 고친 내용은 GitHub 저장소의 content.json에 저장되고, 1~2분 뒤 사이트에 반영돼요.</p>

  <form id="login">
    <fieldset>
      <legend>GitHub 연결</legend>
      <div class="row">
        <div><label for="owner">GitHub 아이디</label><input id="owner" autocomplete="username" required></div>
        <div><label for="repo">저장소 이름</label><input id="repo" required></div>
      </div>
      <label for="branch">브랜치</label><input id="branch" value="main" required>
      <label for="token">액세스 토큰 (이 브라우저에만 저장돼요)</label><input id="token" type="password" autocomplete="current-password" required>
      <div style="margin-top:18px"><button type="submit">불러오기</button></div>
    </fieldset>
  </form>

  <form id="editor" hidden></form>
</div>

<div class="bar" id="bar" hidden>
  <div class="in">
    <span id="status" role="status"></span>
    <a id="viewSite" href="./" target="_blank" rel="noopener">사이트 보기</a>
    <button type="button" class="ghost" id="logout">연결 해제</button>
    <button type="button" id="save">저장하기</button>
  </div>
</div>

<script>
var SCHEMA = [
  ['기본', [['accent','포인트 색','color']]],
  ['0집 (맨 위)', [
    ['hero.kicker','작은 문구'],['hero.title','이름'],['hero.titleAccent','강조 문구 (0집)'],
    ['hero.lead','소개 문장','area'],['album.description','설명','area'],['album.tracklist','수록곡 (한 줄에 한 곡)','area'],
    ['album.hiddenTrack','히든 트랙 문구 (비우면 숨김)'],['album.price','가격'],
    ['album.buyButton','구매 버튼 글자'],['album.buyUrl','구매 링크 (#order 이면 이 페이지의 주문서로 이동)'],
    ['album.coverImage','자켓 이미지 주소','cover']]],
  ['100일 라이브', [
    ['live.headline','제목','area'],['live.description','설명','area'],
    ['live.startDate','시작일','date'],['live.days','기간 (일)','number'],
    ['live.time','방송 시간'],['live.place','장소']]],
  ['주문서', [
    ['order.bank','입금 계좌 (은행 계좌번호 예금주)'],['order.priceNote','가격 옆 안내 (예: 택배비 포함)'],
    ['order.maxQty','한 번에 주문할 수 있는 최대 수량','number']]],
  ['공연', [
    ['concert.headline','제목','area'],['concert.description','설명','area'],
    ['concert.venue','장소'],['concert.time','시간'],['concert.ticket','티켓'],
    ['concert.ticketButton','버튼 글자'],['concert.ticketUrl','예매 링크','url']]],
  ['링크', [['links.youtube','유튜브 채널','url'],['links.instagram','인스타그램','url'],['links.email','이메일','email']]]
];
var KEY = 'yhb-admin', cfg = {}, content = null, sha = null;
var $ = function(id){ return document.getElementById(id); };
function status(t){ $('status').textContent = t; }
function get(o,p){ return p.split('.').reduce(function(a,k){ return a==null?a:a[k]; }, o); }
function set(o,p,v){ var ks=p.split('.'), last=ks.pop(); ks.forEach(function(k){ o=o[k]=o[k]||{}; }); o[last]=v; }
function b64enc(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64dec(s){ return decodeURIComponent(escape(atob(s.replace(/\n/g,'')))); }
function api(path, opts){
  opts = opts || {};
  opts.headers = { 'Authorization': 'Bearer ' + cfg.token, 'Accept': 'application/vnd.github+json' };
  return fetch('https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + path + (opts.method ? '' : '?ref=' + encodeURIComponent(cfg.branch)), opts)
    .then(function(r){ return r.json().then(function(j){ if (!r.ok) throw new Error(j.message || r.status); return j; }); });
}
try { cfg = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) {}
['owner','repo','branch','token'].forEach(function(k){ if (cfg[k]) $(k).value = cfg[k]; });

function buildForm(){
  var f = $('editor'); f.textContent = '';
  SCHEMA.forEach(function(sec){
    var fs = document.createElement('fieldset'), lg = document.createElement('legend');
    lg.textContent = sec[0]; fs.appendChild(lg);
    sec[1].forEach(function(fd){
      var id = 'f_' + fd[0].replace('.','_'), type = fd[2] || 'text';
      var lb = document.createElement('label'); lb.htmlFor = id; lb.textContent = fd[1]; fs.appendChild(lb);
      var el = type === 'area' ? document.createElement('textarea') : document.createElement('input');
      if (type !== 'area') el.type = type === 'cover' ? 'text' : type;
      el.id = id; el.dataset.path = fd[0];
      var v = get(content, fd[0]); el.value = v == null ? '' : v;
      fs.appendChild(el);
      if (type === 'cover') {
        var up = document.createElement('input'); up.type = 'file'; up.accept = 'image/*'; up.style.marginTop = '8px';
        up.setAttribute('aria-label', '자켓 이미지 올리기');
        var prev = document.createElement('img'); prev.className = 'cover-prev'; prev.alt = '자켓 미리보기';
        if (el.value) prev.src = el.value; else prev.hidden = true;
        up.addEventListener('change', function(){ uploadCover(up.files[0], el, prev); });
        fs.appendChild(up); fs.appendChild(prev);
      }
    });
    f.appendChild(fs);
  });
}
function collect(){
  var c = JSON.parse(JSON.stringify(content));
  document.querySelectorAll('#editor [data-path]').forEach(function(el){
    set(c, el.dataset.path, el.type === 'number' ? Number(el.value) : el.value);
  });
  return c;
}
function uploadCover(file, input, prev){
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { status('이미지는 5MB 이하로 올려주세요.'); return; }
  var ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  var path = 'images/cover-' + Date.now() + '.' + ext;
  status('이미지 올리는 중…');
  var rd = new FileReader();
  rd.onload = function(){
    var data = rd.result.split(',')[1];
    api(path, { method: 'PUT', body: JSON.stringify({ message: '자켓 이미지 업로드', content: data, branch: cfg.branch }) })
      .then(function(){ input.value = path; prev.src = rd.result; prev.hidden = false; status('이미지를 올렸어요. 저장하기를 눌러야 사이트에 반영돼요.'); })
      .catch(function(e){ status('이미지 업로드 실패: ' + e.message); });
  };
  rd.readAsDataURL(file);
}
$('login').addEventListener('submit', function(e){
  e.preventDefault();
  cfg = { owner: $('owner').value.trim(), repo: $('repo').value.trim(), branch: $('branch').value.trim() || 'main', token: $('token').value.trim() };
  try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch(err) {}
  $('bar').hidden = false; status('불러오는 중…');
  api('content.json').then(function(j){
    sha = j.sha; content = JSON.parse(b64dec(j.content));
    buildForm(); $('login').hidden = true; $('editor').hidden = false; status('불러왔어요.');
  }).catch(function(err){ status('불러오기 실패: ' + err.message + ' (아이디·저장소·토큰을 확인해 주세요)'); });
});
$('save').addEventListener('click', function(){
  if (!content) return;
  var c = collect(); $('save').disabled = true; status('저장하는 중…');
  api('content.json', { method: 'PUT', body: JSON.stringify({ message: '사이트 내용 수정', content: b64enc(JSON.stringify(c, null, 2) + '\n'), sha: sha, branch: cfg.branch }) })
    .then(function(j){ sha = j.content.sha; content = c; status('저장했어요. 1~2분 뒤 사이트에 반영돼요.'); })
    .catch(function(err){ status('저장 실패: ' + err.message); })
    .then(function(){ $('save').disabled = false; });
});
$('logout').addEventListener('click', function(){
  try { localStorage.removeItem(KEY); } catch(e) {}
  location.reload();
});
</script>
</body>
</html>
